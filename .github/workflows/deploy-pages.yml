name: Deploy to GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one deploy at a time; let an in-progress deploy finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Project pages are served from /<repo>/; user/org pages (<name>.github.io) from the root.
      - name: Set web base URL
        run: |
          repo="${{ github.event.repository.name }}"
          if [[ "$repo" == *.github.io ]]; then base=""; else base="/$repo"; fi
          jq --arg base "$base" '.expo.experiments.baseUrl = $base' app.json > app.json.tmp
          mv app.json.tmp app.json

      - name: Export web build
        run: npx expo export --platform web

      # Stop Pages from running Jekyll, which drops folders starting with "_" (Expo puts its JS in _expo/).
      - run: touch dist/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
